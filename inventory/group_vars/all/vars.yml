# --- Network (same values as cephlibvirt) ---
domain: "local.labmesh.org"
dns: "192.168.1.150"
gateway: "192.168.1.1"
prefix: 24
bridge_name: "br0"
libvirt_network: "bridged-network" # same libvirt network cephlibvirt uses (virsh net-list)

# --- Host-side storage ---
# Directory backing your libvirt pool (virsh pool-dumpxml <pool> | grep path)
libvirt_pool_name: "SSD1_VMs"
libvirt_pool_dir: "/ssd1/VMs"
# Base cloud image (RHEL 9 KVM guest image). Copied once into the pool, then each VM gets an overlay.
qcow_source: "/home/momo/rhel-9.8-x86_64-kvm.qcow2"
base_image_name: "rhel9-base.qcow2"
# osinfo name for virt-install (list with: virt-install --osinfo list | grep rhel9)
vm_osinfo: "rhel9-unknown"
# Where the cloud-init seed files are rendered on the hypervisor
workdir: "/ssd1/workdir/vault"

# --- Guest access ---
vm_username: "admin" # SSH user created by cloud-init (matches ansible.cfg remote_user)
ansible_user: "{{ vm_username }}"
mypassword: "{{ lookup('file', '~/mypassword') }}" # openssl passwd -6 > ~/mypassword           
mysshkey: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

# --- Used in step 3 (OS update) ---
rhel_release: "9.8"
myac: "{{ lookup('file', '~/activationkey') }}"
myorg: "{{ lookup('file', '~/organization') }}"

# --- Vault ---
vault_version: "2.1.2"
vault_port: 8200
vault_cluster_port: 8201
vault_tls_dir: "/opt/vault/tls"
# Wildcard *.local.labmesh.org cert (same files cephlibvirt uses). fullchain = leaf first, then CA.
vault_tls_cert_src: "~/cephcerts/fullchain.pem"
vault_tls_key_src: "~/cephcerts/key.pem"
# Lab setting: 1 key, 1 to unseal. Use 5/3 for anything real.
vault_key_shares: 1
vault_key_threshold: 1
# Unseal keys + root token are written here on the controller (never commit this file)
vault_init_file: "{{ lookup('env', 'HOME') }}/vault-init.json"

